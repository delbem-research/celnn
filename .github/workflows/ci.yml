name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  static:
    name: Static
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install static-analysis environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,torch]"
      - name: Ruff
        run: ruff check .
      - name: Pyright
        run: pyright

  python:
    name: Python / ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install base package and test runner
        if: matrix.python-version != '3.10'
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install "pytest>=8"
      - name: Install Python 3.10 base dependency floor
        if: matrix.python-version == '3.10'
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . --no-deps
          python -m pip install \
            "numpy==1.24.0" \
            "pytest>=8"
      - name: Run base-compatible suite
        run: pytest
      - name: Install declared non-CUDA optional dependency floors
        if: matrix.python-version == '3.10'
        run: |
          python -m pip install \
            "scipy==1.10.0" \
            "torch==2.2.0" \
            "pillow==10.0.0" \
            "matplotlib==3.8.0" \
            "deap==1.4.0"
      - name: Run suite at declared dependency floors
        if: matrix.python-version == '3.10'
        run: pytest

  integrations:
    name: Integrations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install supported non-CUDA integrations
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[scipy,ga,image,viz]"
          python -m pip install \
            "torch>=2.2" \
            --index-url https://download.pytorch.org/whl/cpu
          python -m pip install "pytest>=8"
      - name: Run full non-CUDA suite
        run: pytest

  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build distributions
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine
          python -m build
          python -m twine check --strict dist/*
      - name: Verify docs are absent from release artifacts
        run: python docs/check_distribution_isolation.py
      - name: Create exact-wheel verification environment
        run: |
          python -m venv .venv-wheel
          .venv-wheel/bin/python -m pip install --upgrade pip
          .venv-wheel/bin/python -m pip install dist/*.whl "pyright>=1.1"
          .venv-wheel/bin/python -m pip install -r docs/requirements.txt
      - name: Smoke-test exact wheel
        run: |
          source .venv-wheel/bin/activate
          cd /tmp
          python - <<'PY'
          from importlib.resources import files

          import numpy as np
          from celnn import CellularNetwork, SimulationConfig

          assert files("celnn").joinpath("py.typed").is_file()

          net = CellularNetwork(
              input=np.ones(4),
              feedback=[0.0, 0.0, 0.0],
              control=[0.0, 1.0, 0.0],
              activation="identity",
          )
          result = net.run(SimulationConfig(t_end=0.1, dt=0.1))
          assert result.output.shape == (4,)
          PY
      - name: Build base docs against exact wheel
        run: |
          source .venv-wheel/bin/activate
          python -m sphinx -W --keep-going -b html \
            docs/source docs/_build/html
          python docs/check_reference.py docs/_build/html/objects.inv
      - name: Install real Torch publication dependency
        run: |
          .venv-wheel/bin/python -m pip install \
            "torch>=2.2" \
            --index-url https://download.pytorch.org/whl/cpu
      - name: Build real-Torch docs against exact wheel
        env:
          CELNN_DOCS_REAL_TORCH: "1"
        run: |
          source .venv-wheel/bin/activate
          python -m sphinx -W --keep-going -b html \
            docs/source docs/_build/html-torch
          python docs/check_reference.py \
            docs/_build/html-torch/objects.inv
      - name: Verify exact wheel typing
        run: |
          source .venv-wheel/bin/activate
          python -m pip install \
            "scipy>=1.10" \
            "deap>=1.4" \
            "pillow>=10" \
            "matplotlib>=3.8"
          cd /tmp
          pyright --verifytypes celnn --ignoreexternal
