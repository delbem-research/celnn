[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "celnn-docs"
version = "0.1.0"
description = "Isolated build tooling for the CELNN technical documentation."
requires-python = ">=3.12"
dependencies = [
  "Sphinx>=9.1,<10",
  "myst-nb>=1.4,<2",
  "furo>=2025.12.19,<2027",
]

[tool.setuptools]
packages = []
py-modules = []
