[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "celnn"
version = "1.0.0"
description = "Generic Cellular Neural Networks for scientific computing and reusable local dynamical systems."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
  { name = "Tomieiro" }
]
keywords = [
  "cellular neural networks",
  "cnn",
  "dynamical systems",
  "scientific computing",
  "signal processing",
  "image processing",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering",
  "Topic :: Scientific/Engineering :: Mathematics",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "numpy>=1.24",
]

[project.optional-dependencies]
scipy = ["scipy>=1.10"]
gpu = [
  "cupy-cuda12x>=13.0",
  "nvidia-cuda-nvrtc-cu12>=12.0",
]
image = ["pillow>=10.0"]
viz = ["matplotlib>=3.8"]
ga = ["deap>=1.4"]
torch = ["torch>=2.2"]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.8",
  "pyright>=1.1",
]
all = [
  "scipy>=1.10",
  "cupy-cuda12x>=13.0",
  "nvidia-cuda-nvrtc-cu12>=12.0",
  "pillow>=10.0",
  "matplotlib>=3.8",
  "deap>=1.4",
]

[project.urls]
Homepage = "https://github.com/delbem-research/celnn"
Repository = "https://github.com/delbem-research/celnn"
Documentation = "https://github.com/delbem-research/celnn/tree/main/docs"
Issues = "https://github.com/delbem-research/celnn/issues"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
celnn = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 79
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
